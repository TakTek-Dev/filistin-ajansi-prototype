<svg id="lejant-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Lejant: the symbol set. 24-unit grid, 1.7 stroke, square ends. Colour comes from the context:
       magenta = today's overprint, base grey = earlier. Filled parts carry class "dolu". -->
  <defs>
    <!-- baskın: a movement into a place -->
    <symbol id="i-baskin" viewBox="0 0 24 24"><circle cx="14" cy="12" r="7"/><path d="M1.5 12H13M9.5 8.5L13 12L9.5 15.5"/></symbol>
    <!-- gözaltı: a person held inside an enclosure -->
    <symbol id="i-gozalti" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/><circle class="dolu" cx="12" cy="12" r="2.6"/></symbol>
    <!-- yerleşimci saldırısı: an incident burst -->
    <symbol id="i-yerlesimci" viewBox="0 0 24 24"><path d="M12 3V9M12 15V21M3 12H9M15 12H21M5.6 5.6L9.5 9.5M14.5 14.5L18.4 18.4M18.4 5.6L14.5 9.5M9.5 14.5L5.6 18.4"/></symbol>
    <!-- yıkım: a house struck through -->
    <symbol id="i-yikim" viewBox="0 0 24 24"><path d="M5 11.5L12 5.5L19 11.5V19H5Z"/><path d="M3.5 20.5L20.5 3.5"/></symbol>
    <!-- kapalı kapı: a braced gate shut between two posts (a field gate, so it never reads as a letter) -->
    <symbol id="i-kapi" viewBox="0 0 24 24"><path d="M3.5 5V20M20.5 5V20"/><path d="M3.5 8.5H20.5V15.5H3.5Z"/><path d="M3.5 15.5L20.5 8.5"/></symbol>
    <!-- açık kapı: the same gate swung open on its hinge post -->
    <symbol id="i-kapi-acik" viewBox="0 0 24 24"><path d="M3.5 5V20M20.5 5V20"/><path d="M3.5 8.5L11 5.5V12.5L3.5 15.5Z"/><path d="M3.5 15.5L11 5.5"/></symbol>
    <!-- kontrol noktası: a ring with a bar -->
    <symbol id="i-kontrol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M7.5 12H16.5" stroke-width="3"/></symbol>
    <!-- toprak set / yol kapatma: a mound on the road -->
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M3 17.5H21"/><path class="dolu" d="M6 17.5A6 6 0 0 1 18 17.5Z"/></symbol>
    <!-- zeytin: the orchard symbol of topographic maps -->
    <symbol id="i-zeytin" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="5"/><path d="M12 14.5V20.5"/><circle class="dolu" cx="12" cy="9.5" r="1.4"/></symbol>
    <!-- can kaybı: a solid point -->
    <symbol id="i-kayip" viewBox="0 0 24 24"><circle class="dolu" cx="12" cy="12" r="5.5"/></symbol>
    <!-- yaralı -->
    <symbol id="i-yarali" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 8V16M8 12H16"/></symbol>
    <!-- saldırı / ateşkes ihlali (Gazze): a filled star burst -->
    <symbol id="i-saldiri" viewBox="0 0 24 24"><path class="dolu" d="M12 2.5L14 8.6L19.6 5.4L16.6 11L22 12L16.6 13L19.6 18.6L14 15.4L12 21.5L10 15.4L4.4 18.6L7.4 13L2 12L7.4 11L4.4 5.4L10 8.6Z"/></symbol>
    <!-- insani durum: aid and access -->
    <symbol id="i-insani" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/><path d="M12 8.5V15.5M8.5 12H15.5"/></symbol>
    <!-- Mescid-i Aksa / Kudüs: dome and finial -->
    <symbol id="i-aksa" viewBox="0 0 24 24"><path d="M5 18.5H19"/><path d="M7 18.5A5 5.5 0 0 1 17 18.5"/><path d="M12 13V8.5"/><circle class="dolu" cx="12" cy="7" r="1.5"/></symbol>
    <!-- esir: a cell window -->
    <symbol id="i-esir" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/><path d="M9.7 5V19M14.3 5V19"/></symbol>
    <!-- siyaset ve diplomasi: a pennant -->
    <symbol id="i-siyaset" viewBox="0 0 24 24"><path d="M7 3.5V20.5"/><path d="M7 4.5H18L14.8 8.5L18 12.5H7"/></symbol>
    <!-- other -->
    <symbol id="i-diger" viewBox="0 0 24 24"><path d="M12 4L20 12L12 20L4 12Z"/></symbol>
    <!-- nirengi: the brand's own point, a verified place -->
    <symbol id="i-nirengi" viewBox="0 0 24 24"><path d="M3.5 19.5H20.5L12 4.8Z"/><circle class="dolu" cx="12" cy="14.6" r="1.6"/></symbol>
    <!-- interface icons, drawn in the same stroke -->
    <symbol id="u-ara" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L20.5 20.5"/></symbol>
    <symbol id="u-menu" viewBox="0 0 24 24"><path d="M3.5 7H20.5M3.5 12H20.5M3.5 17H20.5"/></symbol>
    <symbol id="u-kapat" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19"/></symbol>
    <symbol id="u-gece" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5A8 8 0 1 0 19.5 14.5Z"/></symbol>
    <symbol id="u-gunduz" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5V5M12 19V21.5M2.5 12H5M19 12H21.5M5.3 5.3L7 7M17 17L18.7 18.7M18.7 5.3L17 7M7 17L5.3 18.7"/></symbol>
    <symbol id="u-ok" viewBox="0 0 24 24"><path d="M4 12H19.5M14 6.5L19.5 12L14 17.5"/></symbol>
    <symbol id="u-dis" viewBox="0 0 24 24"><path d="M9 5H19V15M19 5L6 18"/></symbol>
    <symbol id="u-oynat" viewBox="0 0 24 24"><path class="dolu" d="M8 5.5L19 12L8 18.5Z"/></symbol>
    <symbol id="u-kuzey" viewBox="0 0 24 24"><path d="M12 2.5L17.5 20L12 16L6.5 20Z"/><path class="dolu" d="M12 2.5L12 16L6.5 20Z"/></symbol>
  </defs>
</svg>
